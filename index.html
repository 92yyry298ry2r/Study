<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySystem - 5-Day Study System</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #E6E1FF;
            --bg-shell: #FFFFFF;
            --bg-sidebar: #FAFAFA;
            --bg-card: #FFFFFF;
            --border: #EEEEF4;
            --text-main: #0B0B14;
            --text-muted: #8A8A99;
            --primary-purple: #5B36F2;
            --active-blue: #2F7DF6;
            --orange-accent: #F5780F;
            --badge-blue-bg: #D9EEFF;
            --badge-blue-text: #1478F5;
            --badge-orange-bg: #FFF0E0;
            --badge-orange-text: #F57A0A;
            --badge-purple-bg: #ECE8FF;
            --badge-purple-text: #5B36F2;
        }

        .dark {
            --bg-page: #14112B;
            --bg-shell: #1B1833;
            --bg-sidebar: #171429;
            --bg-card: #221F40;
            --border: #2E2A55;
            --text-main: #F4F3FF;
            --text-muted: #A09DBF;
            --primary-purple: #7B5CFF;
            --badge-blue-bg: rgba(20, 120, 245, 0.2);
            --badge-blue-text: #60A5FA;
            --badge-orange-bg: rgba(245, 122, 10, 0.2);
            --badge-orange-text: #FDBA74;
            --badge-purple-bg: rgba(123, 92, 255, 0.2);
            --badge-purple-text: #A78BFA;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: all 0.2s ease-in-out;
            margin: 0;
            overflow: hidden;
        }

        .app-shell {
            background-color: var(--bg-shell);
            border-radius: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            height: calc(100vh - 48px);
            margin: 24px;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 16px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: var(--bg-shell);
        }

        .top-bar {
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background-color: var(--bg-shell);
            z-index: 30;
        }

        .content-area {
            padding: 40px;
            flex: 1;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.04);
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: 999px;
            margin-bottom: 4px;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
        }

        .nav-item.active {
            background-color: var(--active-blue);
            color: #FFFFFF;
        }

        .nav-item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: #EEEEF4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            transition: all 0.2s;
        }

        .dark .nav-item-icon { background-color: #2E2A55; }
        .nav-item.active .nav-item-icon { background-color: rgba(255, 255, 255, 0.2); }

        .search-pill {
            background-color: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 4px 4px 20px;
            display: flex;
            align-items: center;
            width: 400px;
        }

        .dark .search-pill { background-color: #221F40; }

        .btn-pill {
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-purple);
            color: #FFFFFF;
            box-shadow: 0 8px 20px rgba(91, 54, 242, 0.2);
        }

        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(91, 54, 242, 0.3); }

        .btn-black { background-color: #0B0B14; color: #FFFFFF; }
        .btn-black:hover { opacity: 0.9; }

        .badge {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-blue { background-color: var(--badge-blue-bg); color: var(--badge-blue-text); }
        .badge-orange { background-color: var(--badge-orange-bg); color: var(--badge-orange-text); }
        .badge-purple { background-color: var(--badge-purple-bg); color: var(--badge-purple-text); }

        .pointer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .pointer-card {
            display: block;
            width: 100%;
            padding: 0;
            text-align: left;
            cursor: pointer;
            border-radius: 24px;
            overflow: hidden;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pointer-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        .pointer-card-img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #0B0B14;
        }

        .pointer-card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
        }

        .pointer-lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: rgba(9, 9, 14, 0.85);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease-out;
        }

        .pointer-lightbox-stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 24px;
            touch-action: none;
        }

        .pointer-lightbox-stage img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transform-origin: center center;
            backface-visibility: hidden;
            image-rendering: auto;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .pointer-lightbox-close {
            position: absolute;
            top: 16px;
            top: max(16px, env(safe-area-inset-top, 0px));
            right: 16px;
            right: max(16px, env(safe-area-inset-right, 0px));
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            padding: 0;
            border: none;
            border-radius: 999px;
            background-color: rgba(20, 20, 30, 0.78);
            backdrop-filter: blur(6px);
            color: #FFFFFF;
            cursor: pointer;
            line-height: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .pointer-lightbox-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .pointer-lightbox-close:active {
            transform: scale(0.92);
        }

        .pointer-zoom-bar {
            position: absolute;
            left: 50%;
            bottom: 24px;
            bottom: max(24px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background-color: rgba(20, 20, 30, 0.78);
            backdrop-filter: blur(6px);
        }

        .pointer-zoom-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 999px;
            background: none;
            color: #FFFFFF;
            cursor: pointer;
        }

        .pointer-zoom-btn:hover {
            background-color: rgba(255, 255, 255, 0.16);
        }

        .pointer-zoom-level {
            min-width: 52px;
            text-align: center;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .topic-table th {
            text-align: left;
            padding: 20px 24px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
        }

        .topic-table td { padding: 24px; border-bottom: 1px solid var(--border); }
        .topic-table tr:last-child td { border-bottom: none; }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2.5px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .custom-checkbox.checked { background-color: var(--primary-purple); border-color: var(--primary-purple); }

        .flashcard-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            height: 420px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            backface-visibility: hidden;
            position: absolute;
            inset: 0;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }
        .flashcard-back { transform: rotateY(180deg); background-color: var(--badge-purple-bg); color: var(--text-main); }

        @media (max-width: 1024px) {
            .app-shell { margin: 0; height: 100vh; border-radius: 0; overflow: hidden; }
            .sidebar { 
                width: 280px; height: 100%; position: fixed; top: 0; left: 0; z-index: 100; 
                flex-direction: column; padding: 24px; 
                background: var(--bg-main);
                box-shadow: 10px 0 30px rgba(0,0,0,0.1);
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { 
                position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
                backdrop-filter: blur(4px); z-index: 90; 
                opacity: 0; pointer-events: none; transition: opacity 0.3s;
            }
            .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
            
            .sidebar .logo { display: flex; }
            .sidebar .section-label { display: block; }
            .sidebar .flex-1 > div:last-child { display: block; }
            .sidebar .flex-1 { display: block; }
            
            .nav-item { flex-direction: row; padding: 12px 16px; margin-bottom: 8px; border-radius: 16px; gap: 12px; align-items: center; max-width: none; }
            .nav-item-icon { margin-right: 0; width: 36px; height: 36px; padding: 8px; }
            .nav-item span { font-size: 14px; font-weight: 700; text-align: left; }
            
            .main-content { padding-bottom: 0; height: 100vh; }
            .top-bar { padding: 16px 20px; flex-direction: row; height: auto; position: sticky; top: 0; background: var(--bg-main); z-index: 40; gap: 12px; }
            .search-pill { width: auto; flex: 1; }
            .content-area { padding: 20px 16px; }
            
            .menu-btn { display: flex !important; }
        }

        .menu-btn { 
            display: none; width: 44px; height: 44px; 
            border-radius: 12px; border: 1px solid var(--border);
            align-items: center; justify-content: center;
            color: var(--text-main);
        }

        @media (max-width: 640px) {
            .top-bar { flex-direction: column; align-items: stretch; gap: 12px; }
            .top-bar .flex.items-center.gap-4 { justify-content: flex-end; }
            .text-[40px] { font-size: 32px; }
            .card { padding: 20px; border-radius: 24px; }
            
            /* Stats Grid */
            .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
            .stats-grid .card { padding: 16px; }
            .stats-grid .text-3xl { font-size: 22px; }
            .stats-grid .text-sm { font-size: 9px; }

            /* Table to Cards */
            .topic-table thead { display: none; }
            .topic-table, .topic-table tbody, .topic-table tr, .topic-table td { display: block; width: 100%; }
            .topic-table tr { border-bottom: 1px solid var(--border); padding: 20px; position: relative; }
            .topic-table tr:last-child { border-bottom: none; }
            .topic-table td { padding: 8px 0; border: none; }
            .topic-table td[data-label]:before { 
                content: attr(data-label); 
                font-weight: 800; font-size: 10px; color: var(--text-muted); 
                text-transform: uppercase; display: block; margin-bottom: 4px; 
            }
            .topic-table td:last-child { padding-top: 16px; }
            .topic-table .btn-pill { width: 100%; }

            /* Flashcard adjustment */
            .flashcard-inner { height: 380px; }
            .flashcard-front, .flashcard-back { padding: 24px; border-radius: 30px; }
            .flashcard-front .text-4xl, .flashcard-back .text-4xl { font-size: 24px; text-align: center; }
            
            /* Mock Exam Review */
            .sticky.top-\[89px\] { top: 0; padding: 10px 0; background: var(--bg-main); }
        }

        .main-content::-webkit-scrollbar { display: none; }
        .main-content { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        const shuffle = (array) => {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        };

        const shuffleQuestion = (q) => {
            const options = [...q.a];
            const correctVal = options[q.c];
            const shuffledOpts = shuffle(options);
            return { ...q, a: shuffledOpts, c: shuffledOpts.indexOf(correctVal) };
        };

                            <div className="flex items-center justify-between"><h2 className="text-2xl font-bold">Recommended Topics</h2><button onClick={() => setCurrentView('library')} className="text-[var(--active-blue)] font-bold text-sm">View All</button></div>
                            <div className="card overflow-hidden !p-0">
                                <table className="topic-table w-full">
                                    <thead><tr><th>Topic</th><th>Category</th><th>Priority</th><th>Action</th></tr></thead>
                                    <tbody>
                                        {studyData.topics.slice(0, 5).map(t => (
                                            <tr key={t.id}>
                                                <td data-label="Topic">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center ${t.category === 'Math' ? 'bg-indigo-50 text-indigo-500' : t.category === 'Stats' ? 'bg-orange-50 text-orange-500' : 'bg-blue-50 text-blue-500'} dark:bg-opacity-10`}><Icon name={t.category === 'Math' ? 'function-square' : t.category === 'Stats' ? 'bar-chart' : 'microscope'} /></div>
                                                        <div><div className="font-bold">{t.title}</div><div className="text-xs text-[var(--text-muted)]">{t.flashcards.length} flashcards</div></div>
                                                    </div>
                                                </td>
                                                <td data-label="Category"><span className={`badge ${t.category === 'Math' ? 'badge-purple' : t.category === 'Stats' ? 'badge-orange' : 'badge-blue'}`}>{t.category}</span></td>
                                                <td data-label="Priority"><span className="text-sm font-medium">{t.priority === 'high' ? '⭐ High' : 'Medium'}</span></td>
                                                <td><button onClick={() => { startQuiz(t.id); }} className="btn-pill btn-primary !py-2 !px-6 text-sm">Study</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold">Today's Plan</h2>
                            <div className="card space-y-4">
                                {planner.map((p, i) => (
                                    <div key={i} className="flex items-center gap-4 group">
                                        <div onClick={() => { const n = [...planner]; n[i].done = !n[i].done; setPlanner(n); }} className={`custom-checkbox ${p.done ? 'checked' : ''}`}>{p.done && <Icon name="check" size={14} className="text-white" />}</div>
                                        <span className={`font-medium transition-all ${p.done ? 'line-through text-[var(--text-muted)]' : ''}`}>Day {p.day}: {p.task}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const TopicLibrary = ({ filterWeak }) => {
                const topics = filterWeak ? studyData.topics.filter(t => weakSpots.includes(t.id)) : studyData.topics;
                const query = searchQuery.trim().toLowerCase();
                const filtered = topics.filter(t => {
                    if (!query) return true;
                    const haystack = [
                        t.title,
                        t.category,
                        t.overview,
                        t.mnemonics,
                        ...(t.concepts || []),
                        ...(t.examples || []),
                        ...((t.notes || []).flatMap(section => [section.title, ...section.points]))
                    ].join(' ').toLowerCase();
                    return haystack.includes(query);
                });
                return (
                    <div className="space-y-8 animate-fade-in">
                        <h2 className="text-3xl font-bold">{filterWeak ? 'Weak Spots' : 'Topic Library'}</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filtered.map(t => (
                                <div key={t.id} className="card group cursor-pointer" onClick={() => { setSelectedTopicId(t.id); setCurrentView('topic-detail'); }}>
                                    <div className="flex justify-between items-start mb-6">
                                        <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${t.category === 'Math' ? 'bg-indigo-50 text-indigo-500' : t.category === 'Stats' ? 'bg-orange-50 text-orange-500' : 'bg-blue-50 text-blue-500'} dark:bg-opacity-10`}><Icon name={t.category === 'Math' ? 'function-square' : t.category === 'Stats' ? 'bar-chart' : 'microscope'} size={28} /></div>
                                        <span className={`badge ${t.category === 'Math' ? 'badge-purple' : t.category === 'Stats' ? 'badge-orange' : 'badge-blue'}`}>{t.category}</span>
                                    </div>
                                    <h4 className="text-xl font-bold mb-2 group-hover:text-[var(--primary-purple)] transition-colors">{t.title}</h4>
                                    <p className="text-sm text-[var(--text-muted)] line-clamp-2 mb-6">{t.overview}</p>
                                    <div className="flex items-center justify-between pt-6 border-t border-[var(--border)]"><div className="text-xs font-bold text-[var(--text-muted)] uppercase">{t.flashcards.length} Cards{t.notes?.length ? ` • ${t.notes.length} Notes` : ''}</div><div className="flex items-center gap-1 text-[var(--primary-purple)] font-bold text-sm">Study <Icon name="arrow-right" size={14} /></div></div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const TopicDetail = () => {
                const topic = studyData.topics.find(t => t.id === selectedTopicId);
                return (
                    <div className="max-w-3xl mx-auto space-y-8 animate-fade-in">
                        <button onClick={() => setCurrentView('library')} className="flex items-center gap-2 text-[var(--text-muted)] font-bold hover:text-[var(--text-main)] transition-colors"><Icon name="arrow-left" size={18} /> Back to Library</button>
                        <div className="card !p-10 space-y-10">
                            <div><span className={`badge ${topic.category === 'Math' ? 'badge-purple' : topic.category === 'Stats' ? 'badge-orange' : 'badge-blue'} mb-4`}>{topic.category}</span><h1 className="text-4xl font-extrabold">{topic.title}</h1></div>
                            <div className="space-y-8">
                                <section><h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-blue-500"><Icon name="info" /> Overview</h3><p className="text-lg text-[var(--text-muted)] leading-relaxed">{topic.overview}</p></section>
                                <section><h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-purple-500"><Icon name="list" /> Core Concepts</h3><ul className="grid grid-cols-1 md:grid-cols-2 gap-3">{topic.concepts.map((c, i) => (<li key={i} className="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border border-[var(--border)] font-medium">{c}</li>))}</ul></section>
                                {topic.examples?.length > 0 && <section><h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-emerald-500"><Icon name="sparkles" /> Quick Examples</h3><ul className="space-y-3">{topic.examples.map((example, i) => (<li key={i} className="p-4 bg-emerald-50 dark:bg-emerald-900/10 rounded-2xl border border-emerald-200 dark:border-emerald-900/30 text-emerald-800 dark:text-emerald-200 font-medium">{example}</li>))}</ul></section>}
                                <section><h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-orange-500"><Icon name="zap" /> Memory Aids</h3><div className="p-6 bg-orange-50 dark:bg-orange-900/10 rounded-3xl border border-orange-200 dark:border-orange-900/30 text-orange-800 dark:text-orange-200 italic">"{topic.mnemonics}"</div></section>
                                {topic.notes?.length > 0 && <section><h3 className="text-lg font-bold mb-3 flex items-center gap-2 text-sky-500"><Icon name="book-marked" /> Reference Notes</h3><div className="space-y-4">{topic.notes.map((note, noteIndex) => (<div key={noteIndex} className="p-6 bg-slate-50 dark:bg-slate-800 rounded-3xl border border-[var(--border)]"><div className="font-bold text-lg mb-4">{note.title}</div><ul className="space-y-3">{note.points.map((point, pointIndex) => (<li key={pointIndex} className="flex items-start gap-3 text-sm text-[var(--text-muted)] leading-relaxed"><span className="w-6 h-6 rounded-full bg-[var(--primary-purple)] text-white flex items-center justify-center text-xs font-bold shrink-0">{pointIndex + 1}</span><span>{point}</span></li>))}</ul>{note.problem && <div className="mt-6 p-4 bg-indigo-50 dark:bg-indigo-900/20 rounded-2xl border border-indigo-100 dark:border-indigo-900/30"><div className="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest mb-2">Sample Problem</div><div className="text-sm font-semibold mb-2">{note.problem}</div>{note.solution && <div className="text-sm text-[var(--text-muted)] italic"><span className="font-bold text-indigo-500">Solution:</span> {note.solution}</div>}</div>}</div>))}</div></section>}
                            </div>
                            <div className="flex gap-4"><button onClick={() => { startQuiz(topic.id); }} className="btn-pill btn-primary flex-1 py-4">Take Quiz</button><button onClick={() => setCurrentView('flashcards')} className="btn-pill btn-black flex-1 py-4">Flashcards</button></div>
                        </div>
                    </div>
                );
            };

            const QuizMode = ({ state, setState, onComplete }) => {
                const { questions, currentQ, selectedOpt, score, isFinished, topicId } = state;
                
                if (questions.length === 0) return null;

                const q = questions[currentQ];

                if (isFinished) return (
                    <div className="max-w-md mx-auto text-center space-y-8 animate-fade-in">
                        <div className="w-32 h-32 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-600"><Icon name="check-circle" size={64} /></div>
                        <h2 className="text-3xl font-bold">Quiz Finished!</h2><div className="text-5xl font-extrabold text-[var(--primary-purple)]">{score}/{questions.length}</div>
                        <button onClick={() => { startQuiz(topicId); }} className="btn-pill btn-black w-full py-4">Restart Quiz</button>
                        <button onClick={() => setCurrentView('dashboard')} className="btn-pill btn-primary w-full py-4">Back to Dashboard</button>
                    </div>
                );

                return (
                    <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
                        <div className="flex justify-between items-center"><div className="text-sm font-bold text-[var(--text-muted)] uppercase tracking-widest">Question {currentQ + 1} of {questions.length}</div><div className="h-2 w-32 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden"><div className="h-full bg-[var(--primary-purple)] transition-all" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div></div></div>
                        <div className="card !p-8 space-y-8">
                            <h3 className="text-2xl font-bold">{q.q}</h3>
                            <div className="grid gap-3">{q.a.map((opt, i) => {
                                let style = "border-[var(--border)] hover:bg-slate-50 dark:hover:bg-slate-800";
                                if (selectedOpt !== null) { if (i === q.c) style = "bg-emerald-50 border-emerald-500 text-emerald-700"; else if (i === selectedOpt) style = "bg-rose-50 border-rose-500 text-rose-700"; }
                                return (<button key={i} disabled={selectedOpt !== null} onClick={() => { 
                                    const isCorrect = i === q.c;
                                    setState(s => ({
                                        ...s,
                                        selectedOpt: i,
                                        score: isCorrect ? s.score + 1 : s.score
                                    }));
                                    if (!isCorrect) {
                                        setWeakSpots(w => [...new Set([...w, topicId || q.topic])]);
                                    }
                                }} className={`p-5 rounded-2xl border-2 text-left font-semibold transition-all ${style}`}>{opt}</button>);
                            })}</div>
                            {selectedOpt !== null && <div className="p-6 bg-indigo-50 dark:bg-indigo-900/10 rounded-2xl text-sm leading-relaxed"><span className="font-bold text-[var(--primary-purple)]">Explanation:</span> {q.e}</div>}
                            {selectedOpt !== null && <button onClick={() => { 
                                if (currentQ < questions.length - 1) { 
                                    setState(s => ({ ...s, currentQ: s.currentQ + 1, selectedOpt: null }));
                                } else { 
                                    setState(s => ({ ...s, isFinished: true }));
                                    onComplete(score + (selectedOpt === q.c ? 1 : 0), questions.length);
                                } 
                            }} className="btn-pill btn-primary w-full py-4">{currentQ === questions.length - 1 ? 'Finish Quiz' : 'Next Question'}</button>}
                        </div>
                    </div>
                );
            };

            const FlashcardsView = () => {
                const topic = studyData.topics.find(t => t.id === selectedTopicId) || studyData.topics[0];
                const cards = useMemo(() => shuffle(topic.flashcards), [topic.id]);
                const [idx, setIdx] = useState(0);
                const [flipped, setFlipped] = useState(false);
                return (
                    <div className="max-w-md mx-auto space-y-12 text-center animate-fade-in">
                        <h2 className="text-3xl font-bold">Flashcards</h2>
                        <div className="flashcard-container" onClick={() => setFlipped(!flipped)}>
                            <div className={`flashcard-inner ${flipped ? 'flipped' : ''}`}>
                                <div className="flashcard-front bg-white dark:bg-slate-800">
                                    <p className="text-2xl font-bold">{cards[idx].f}</p>
                                    <div className="absolute bottom-8 text-[var(--text-muted)] text-sm font-bold flex items-center gap-2"><Icon name="mouse-pointer-2" size={14} /> Tap to flip</div>
                                </div>
                                <div className="flashcard-back"><p className="text-xl font-medium">{cards[idx].b}</p></div>
                            </div>
                        </div>
                        <div className="flex gap-4"><button onClick={() => { setFlipped(false); setTimeout(() => setIdx(i => (i + 1) % cards.length), 200); }} className="btn-pill btn-black flex-1 py-4">Review Again</button><button onClick={() => { setFlipped(false); setTimeout(() => setIdx(i => (i + 1) % cards.length), 200); }} className="btn-pill btn-primary flex-1 py-4">Got It</button></div>
                    </div>
                );
            };

            const Pointers = () => {
                const images = [
                    { src: 'Pointers/pointer-1.jpg', title: 'Pointer 1' },
                    { src: 'Pointers/pointer-2.jpg', title: 'Pointer 2' },
                    { src: 'Pointers/pointer-3.jpg', title: 'Pointer 3' }
                ];
                const MIN_SCALE = 1;
                const [active, setActive] = useState(null);
                const [view, setView] = useState({ scale: 1, x: 0, y: 0 });
                const stageRef = React.useRef(null);
                const viewRef = React.useRef(view);
                const ptsRef = React.useRef(new Map());
                const gestureRef = React.useRef(null);
                const maxScaleRef = React.useRef(4);
                viewRef.current = view;

                const clampScale = (s) => Math.min(maxScaleRef.current, Math.max(MIN_SCALE, s));

                const syncMaxScale = (img) => {
                    if (!img || !img.offsetWidth) return;
                    const fit = img.naturalWidth / img.offsetWidth;
                    maxScaleRef.current = Math.min(8, Math.max(2, fit * 1.75));
                };

                const clampPan = (scale, x, y) => {
                    const el = stageRef.current;
                    if (!el) return { x, y };
                    const r = el.getBoundingClientRect();
                    const ax = Math.max(0, (scale - 1) * r.width / 2);
                    const ay = Math.max(0, (scale - 1) * r.height / 2);
                    return { x: Math.min(ax, Math.max(-ax, x)), y: Math.min(ay, Math.max(-ay, y)) };
                };

                const relToCenter = (clientX, clientY) => {
                    const el = stageRef.current;
                    if (!el) return { cx: 0, cy: 0 };
                    const r = el.getBoundingClientRect();
                    return { cx: clientX - (r.left + r.width / 2), cy: clientY - (r.top + r.height / 2) };
                };

                const zoomAt = (factor, cx, cy) => {
                    setView(v => {
                        const s = clampScale(v.scale * factor);
                        const k = s / v.scale;
                        const p = clampPan(s, cx - k * (cx - v.x), cy - k * (cy - v.y));
                        return { scale: s, x: p.x, y: p.y };
                    });
                };

                const resetView = () => setView({ scale: 1, x: 0, y: 0 });
                const openImage = (i) => { resetView(); setActive(i); };
                const closeImage = () => { setActive(null); resetView(); };

                useEffect(() => {
                    if (active === null) return;
                    const el = stageRef.current;
                    if (!el) return;
                    const onWheel = (e) => {
                        e.preventDefault();
                        const { cx, cy } = relToCenter(e.clientX, e.clientY);
                        zoomAt(Math.exp(-e.deltaY * 0.0025), cx, cy);
                    };
                    const onKey = (e) => { if (e.key === 'Escape') closeImage(); };
                    el.addEventListener('wheel', onWheel, { passive: false });
                    window.addEventListener('keydown', onKey);
                    return () => {
                        el.removeEventListener('wheel', onWheel);
                        window.removeEventListener('keydown', onKey);
                    };
                }, [active]);

                const onPointerDown = (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.currentTarget.setPointerCapture(e.pointerId);
                    ptsRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    const pts = [...ptsRef.current.values()];
                    if (pts.length === 1) {
                        gestureRef.current = { mode: 'pan', startX: e.clientX, startY: e.clientY, base: { ...viewRef.current } };
                    } else if (pts.length === 2) {
                        const [a, b] = pts;
                        gestureRef.current = {
                            mode: 'pinch',
                            startDist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
                            startMid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
                            base: { ...viewRef.current }
                        };
                    }
                };

                const onPointerMove = (e) => {
                    if (!ptsRef.current.has(e.pointerId)) return;
                    ptsRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    const g = gestureRef.current;
                    if (!g) return;
                    const pts = [...ptsRef.current.values()];
                    if (g.mode === 'pinch' && pts.length >= 2) {
                        const [a, b] = pts;
                        const factor = (Math.hypot(a.x - b.x, a.y - b.y) || 1) / g.startDist;
                        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                        const s = clampScale(g.base.scale * factor);
                        const k = s / g.base.scale;
                        const c0 = relToCenter(g.startMid.x, g.startMid.y);
                        const c1 = relToCenter(mid.x, mid.y);
                        const p = clampPan(s, c1.cx - k * (c0.cx - g.base.x), c1.cy - k * (c0.cy - g.base.y));
                        setView({ scale: s, x: p.x, y: p.y });
                    } else if (g.mode === 'pan') {
                        const p = clampPan(g.base.scale, g.base.x + (e.clientX - g.startX), g.base.y + (e.clientY - g.startY));
                        setView({ scale: g.base.scale, x: p.x, y: p.y });
                    }
                };

                const onPointerUp = (e) => {
                    ptsRef.current.delete(e.pointerId);
                    const pts = [...ptsRef.current.values()];
                    if (pts.length === 1) {
                        gestureRef.current = { mode: 'pan', startX: pts[0].x, startY: pts[0].y, base: { ...viewRef.current } };
                    } else if (pts.length === 0) {
                        gestureRef.current = null;
                    }
                };

                const onDoubleClick = (e) => {
                    const { cx, cy } = relToCenter(e.clientX, e.clientY);
                    if (viewRef.current.scale > 1) resetView();
                    else zoomAt(2.5, cx, cy);
                };

                return (
                    <div className="space-y-8 animate-fade-in">
                        <div>
                            <h2 className="text-3xl font-extrabold">Pointers</h2>
                            <p className="text-[var(--text-muted)] mt-1">{images.length} quick-reference images</p>
                        </div>
                        <div className="pointer-grid">
                            {images.map((img, i) => (
                                <button key={img.src} className="pointer-card" onClick={() => openImage(i)}>
                                    <img src={img.src} alt={img.title} loading="lazy" className="pointer-card-img" />
                                    <div className="pointer-card-foot">
                                        <span className="font-bold">{img.title}</span>
                                        <Icon name="maximize-2" size={16} className="text-[var(--text-muted)]" />
                                    </div>
                                </button>
                            ))}
                        </div>
                        {active !== null && (
                            <div className="pointer-lightbox" onClick={closeImage}>
                                <div className="pointer-lightbox-stage"
                                     ref={stageRef}
                                     onClick={(e) => e.stopPropagation()}
                                     onPointerDown={onPointerDown}
                                     onPointerMove={onPointerMove}
                                     onPointerUp={onPointerUp}
                                     onPointerCancel={onPointerUp}
                                     onDoubleClick={onDoubleClick}
                                >
                                    <img
                                        src={images[active].src}
                                        alt={images[active].title}
                                        draggable={false}
                                        onLoad={(e) => syncMaxScale(e.currentTarget)}
                                        style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.scale})` }}
                                    />
                                </div>
                                <div className="pointer-zoom-bar" onClick={(e) => e.stopPropagation()}>
                                    <button className="pointer-zoom-btn" onClick={() => zoomAt(1 / 1.4, 0, 0)} title="Zoom out"><Icon name="zoom-out" size={18} /></button>
                                    <span className="pointer-zoom-level">{Math.round(view.scale * 100)}%</span>
                                    <button className="pointer-zoom-btn" onClick={() => zoomAt(1.4, 0, 0)} title="Zoom in"><Icon name="zoom-in" size={18} /></button>
                                    <button className="pointer-zoom-btn" onClick={resetView} title="Reset zoom"><Icon name="rotate-ccw" size={18} /></button>
                                </div>
                                <button className="pointer-lightbox-close" onClick={closeImage} aria-label="Close image"><Icon name="x" size={26} /></button>
                            </div>
                        )}
                    </div>
                );
            };

        const MockTimer = React.memo(({ time }) => (
            <div className="sticky top-[89px] z-20 flex justify-center">
                <div className="bg-rose-500 text-white px-6 py-2 rounded-full font-mono text-xl font-bold shadow-lg shadow-rose-500/20">
                    {Math.floor(time / 60)}:{(time % 60).toString().padStart(2, '0')}
                </div>
            </div>
        ));

        const MockExam = React.memo(({ state, setState, onReset }) => {
            const { questions, time, answers, isFinished, showReview } = state;

            useEffect(() => { 
                if (isFinished) return;
                const timer = setInterval(() => {
                    setState(s => ({ ...s, time: s.time > 0 ? s.time - 1 : 0 }));
                }, 1000); 
                return () => clearInterval(timer); 
            }, [isFinished, setState]);

            useEffect(() => {
                if (time === 0 && !isFinished) setState(s => ({ ...s, isFinished: true }));
            }, [time, isFinished, setState]);

            if (isFinished && !showReview) return (
                <div className="max-w-2xl mx-auto space-y-10 text-center">
                    <h2 className="text-4xl font-extrabold mb-4">Exam Results</h2>
                    <div className="text-7xl font-[900] text-[var(--primary-purple)]">{questions.filter((q, i) => answers[i] === q.c).length}/{questions.length}</div>
                    <div className="flex flex-col gap-4">
                        <button onClick={() => setState(s => ({ ...s, showReview: true }))} className="btn-pill btn-primary w-full py-4">Review Answers</button>
                        <button onClick={onReset} className="btn-pill btn-black w-full py-4">Restart Exam</button>
                        <button onClick={() => setCurrentView('dashboard')} className="btn-pill border border-[var(--border)] w-full py-4">Return to Dashboard</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto space-y-10">
                    {!isFinished && (
                        <div className="space-y-4">
                            <MockTimer time={time} />
                            <div className="card !p-6 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-[89px] z-30 shadow-xl border-t-4 border-t-[var(--primary-purple)]">
                                <div>
                                    <h3 className="text-xl font-bold">Exam in Progress</h3>
                                    <p className="text-sm text-[var(--text-muted)]">Don't forget to submit before time runs out.</p>
                                </div>
                                <button onClick={() => { if(confirm('Submit exam?')) setState(s => ({ ...s, isFinished: true })); }} className="btn-pill btn-primary px-10 py-4 text-lg w-full sm:w-auto">Submit Exam</button>
                            </div>
                        </div>
                    )}
                    {isFinished && showReview && (
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-3xl font-bold">Review Mode</h2>
                            <button onClick={() => setState(s => ({ ...s, showReview: false }))} className="btn-pill btn-black py-2 px-6">Back to Results</button>
                        </div>
                    )}
                    <div className="space-y-8">{questions.map((q, i) => (
                        <div key={i} className={`card !p-8 space-y-6 ${isFinished && showReview ? (answers[i] === q.c ? 'border-emerald-500/50 bg-emerald-50/5' : 'border-rose-500/50 bg-rose-50/5') : ''}`}>
                            <div className="flex justify-between items-start">
                                <h4 className="text-xl font-bold">{i + 1}. {q.q}</h4>
                                {isFinished && showReview && (
                                    answers[i] === q.c 
                                        ? <span className="text-emerald-500 flex items-center gap-1 font-bold"><Icon name="check-circle" size={20} /> Correct</span>
                                        : <span className="text-rose-500 flex items-center gap-1 font-bold"><Icon name="x-circle" size={20} /> Incorrect</span>
                                )}
                            </div>
                            <div className="grid gap-3">{q.a.map((opt, optIdx) => {
                                let style = "border-[var(--border)]";
                                if (isFinished && showReview) {
                                    if (optIdx === q.c) style = "border-emerald-500 bg-emerald-50 text-emerald-700 dark:bg-emerald-900/20 dark:text-emerald-200";
                                    else if (answers[i] === optIdx) style = "border-rose-500 bg-rose-50 text-rose-700 dark:bg-rose-900/20 dark:text-rose-200";
                                } else if (answers[i] === optIdx) {
                                    style = "border-[var(--primary-purple)] bg-indigo-50 dark:bg-indigo-900/20";
                                } else {
                                    style += " hover:bg-slate-50 dark:hover:bg-slate-800";
                                }

                                return (
                                    <label key={optIdx} className={`p-4 rounded-2xl border-2 flex items-center gap-3 transition-all ${!isFinished ? 'cursor-pointer' : ''} ${style}`}>
                                        <input type="radio" checked={answers[i] === optIdx} onChange={() => !isFinished && setState(s => ({ ...s, answers: { ...s.answers, [i]: optIdx } }))} className="hidden" disabled={isFinished} />
                                        <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${answers[i] === optIdx ? 'border-[var(--primary-purple)]' : 'border-[var(--border)]'}`}>
                                            {answers[i] === optIdx && <div className="w-2.5 h-2.5 bg-[var(--primary-purple)] rounded-full"></div>}
                                        </div>
                                        <span className="font-semibold">{opt}</span>
                                    </label>
                                );
                            })}</div>
                            {isFinished && showReview && (
                                <div className={`p-6 rounded-2xl text-sm leading-relaxed ${answers[i] === q.c ? 'bg-emerald-50 dark:bg-emerald-900/10' : 'bg-rose-50 dark:bg-rose-900/10'}`}>
                                    <span className="font-bold block mb-2">{answers[i] === q.c ? 'Well done!' : 'Explanation:'}</span>
                                    {q.e}
                                </div>
                            )}
                        </div>
                    ))}</div>
                </div>
            );
        }, (prev, next) => {
            return prev.state.questions === next.state.questions &&
                   prev.state.answers === next.state.answers &&
                   prev.state.isFinished === next.state.isFinished &&
                   prev.state.showReview === next.state.showReview;
        });

            return (
                <div className="app-shell">
                    <Sidebar 
                        currentView={currentView} 
                        setCurrentView={setCurrentView} 
                        weakSpots={weakSpots} 
                        isDarkMode={isDarkMode} 
                        setIsDarkMode={setIsDarkMode} 
                        isOpen={sidebarOpen}
                        setIsOpen={setSidebarOpen}
                        startQuiz={startQuiz}
                        resetMockExam={resetMockExam}
                    />
                    <main className="main-content">
                        <TopBar 
                            searchQuery={searchQuery} 
                            setSearchQuery={setSearchQuery} 
                            setCurrentView={setCurrentView} 
                            currentView={currentView} 
                            setSidebarOpen={setSidebarOpen}
                        />
                        <div className="content-area">
                            {currentView === 'dashboard' && <Dashboard />}
                            {currentView === 'library' && <TopicLibrary />}
                            {currentView === 'pointers' && <Pointers />}
                            {currentView === 'weak' && <TopicLibrary filterWeak />}
                            {currentView === 'topic-detail' && <TopicDetail />}
                            {currentView === 'quiz' && <QuizMode state={quizState} setState={setQuizState} onComplete={(score, total) => setQuizScore(prev => ({ total: prev.total + total, correct: prev.correct + score }))} />}
                            {currentView === 'flashcards' && <FlashcardsView />}
                            {currentView === 'mock' && <MockExam state={mockExamState} setState={setMockExamState} onReset={resetMockExam} />}
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
